name: Alibaba Dev Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push-dev:
    runs-on: ubuntu-latest
    environment: aicodex-lab
    permissions:
      contents: read

    env:
      ALIBABA_REGION_ID: ${{ secrets.ALIBABA_REGION_ID }}
      ALIBABA_REGISTRY: registry.${{ secrets.ALIBABA_REGION_ID }}.aliyuncs.com
      IMAGE_NAME: aicodex/backend
      IMAGE_TAG: ${{ github.sha }}
      TF_VAR_region: ${{ secrets.ALIBABA_REGION_ID }}
      TF_VAR_project_name: aicodex
      TF_VAR_vpc_name: aicodex-vpc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout CodexSpaces source
        uses: actions/checkout@v4
        with:
          repository: iarxii/CodexSpaces
          token: ${{ secrets.CODEXSPACES_READ_TOKEN }}
          path: codex_spaces
          fetch-depth: 0
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Terraform dev stack
        working-directory: infra/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Log in to Alibaba Container Registry
        run: |
          echo "${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}" | docker login \
            --username "${{ secrets.ALIBABA_ACCESS_KEY_ID }}" \
            --password-stdin \
            "$ALIBABA_REGISTRY"

      - name: Prepare Docker build context
        run: |
          rm -rf backend/codex_spaces_local backend/skills_local
          mkdir -p backend/codex_spaces_local backend/skills_local
          cp -R codex_spaces/. backend/codex_spaces_local/
          cp -R skills/. backend/skills_local/

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "$ALIBABA_REGISTRY/$IMAGE_NAME:$IMAGE_TAG" \
            -t "$ALIBABA_REGISTRY/$IMAGE_NAME:dev" \
            .

      - name: Push backend image
        run: |
          docker push "$ALIBABA_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$ALIBABA_REGISTRY/$IMAGE_NAME:dev"

      - name: Smoke check guidance
        run: |
          echo "Image published to $ALIBABA_REGISTRY/$IMAGE_NAME:dev"
          echo "Terraform dev stack validated. Next step: apply the dev stack and deploy the image to the GPU ECS target."
