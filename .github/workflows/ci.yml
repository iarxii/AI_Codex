name: Backend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    environment: aicodex-lab
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout CodexSpaces submodule
        env:
          CODEXSPACES_READ_TOKEN: ${{ secrets.CODEXSPACES_READ_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${CODEXSPACES_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init codex_spaces
          git config --global --unset-all url."https://x-access-token:${CODEXSPACES_READ_TOKEN}@github.com/".insteadOf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Validate Python compilation
        run: python -m compileall backend

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-not-for-production
        run: pytest backend --ignore=backend/OllamaOpt_local --ignore=backend/scratch --maxfail=1 -q
