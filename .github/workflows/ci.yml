name: Backend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    environment: aicodex-lab
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout CodexSpaces source
        uses: actions/checkout@v4
        with:
          repository: iarxii/CodexSpaces
          token: ${{ secrets.CODEXSPACES_READ_TOKEN }}
          path: codex_spaces
          fetch-depth: 0

      - name: Align CodexSpaces revision
        run: git -C codex_spaces checkout "$(git ls-tree HEAD codex_spaces | awk '{print $3}')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Validate Python compilation
        run: python -m compileall backend

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-not-for-production
        run: pytest backend --ignore=backend/OllamaOpt_local --ignore=backend/scratch --maxfail=1 -q
